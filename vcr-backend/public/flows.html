<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vonage Flows</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#0b0b0c;--sub:#6b7178;--line:#e8e9ec;--bg:#f6f6f7;--card:#fff;--chip:#f1f2f4;--wa:#25d366;--rcs:#8a38ff;--sms:#6b7178;--ok:#0aa06e;--bad:#c62828;--focus:rgba(138,56,255,.18)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:Inter,-apple-system,'Segoe UI',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus)}
textarea{min-height:84px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:600;color:var(--sub);margin:12px 0 5px}
.top{height:56px;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px}
.top b{font-weight:800;letter-spacing:-.01em;font-size:16px}
.top .sep{width:1px;height:20px;background:rgba(255,255,255,.25)}
.top .sub{color:#b9bdc3;font-size:13px}
.top .sp{flex:1}
.top button{color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600}
.top button.pri{background:#fff;color:var(--ink);border-color:#fff}
.embed .top{display:none}
.app{display:grid;grid-template-columns:290px 1fr 360px;height:calc(100% - 56px)}
.embed .app{height:100%}
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:13px 0;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.list{flex:1;overflow:auto;padding:10px}
.item{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:10px;border:1px solid transparent;margin-bottom:4px}
.item:hover{background:var(--bg)}
.item.on{background:#fff;border-color:var(--ink)}
.item b{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{display:flex;gap:6px;align-items:center;color:var(--sub);font-size:12px;margin-top:3px}
.dot{width:7px;height:7px;border-radius:50%;background:#cfd3d8;flex:none}.dot.on{background:var(--ok)}
.tag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:100px;color:#fff;letter-spacing:.02em;text-transform:uppercase}
.tag.whatsapp{background:var(--wa)}.tag.rcs{background:var(--rcs)}.tag.sms{background:var(--sms)}
.side .foot{padding:10px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ink);color:#fff;font-weight:600;border-radius:9px;padding:9px 14px;font-size:13.5px;white-space:nowrap}
.btn:hover{opacity:.88}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:12.5px}.btn.danger{background:#fff;color:var(--bad);border:1px solid #f1c9c9}.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.main{overflow:auto;padding:22px 26px 60px;min-height:0}
.empty{max-width:520px;margin:80px auto;text-align:center;color:var(--sub)}
.empty h2{color:var(--ink);font-size:22px;font-weight:800;margin-bottom:8px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.card h3{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:6px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.head input.name{font-size:20px;font-weight:800;border:0;background:transparent;padding:4px 0;letter-spacing:-.01em}
.head input.name:focus{box-shadow:none;border-bottom:2px solid var(--ink);border-radius:0}
.sw{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.sw i{width:36px;height:20px;border-radius:20px;background:#d5d8dd;position:relative;transition:.15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--ok)}.sw.on i::after{left:18px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.kw{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff}
.kw span{background:var(--chip);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.kw span b{cursor:pointer;color:var(--sub)}
.kw input{border:0;flex:1;min-width:120px;padding:4px}
.kw input:focus{box-shadow:none}
.step{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.step .sh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.step .sh input{border:0;background:transparent;font-weight:700;font-size:14.5px;padding:2px 4px}
.step .sh input:focus{box-shadow:none;background:var(--bg);border-radius:6px}
.step .tools{display:flex;gap:4px}
.step .tools button{width:28px;height:28px;border-radius:7px;color:var(--sub);display:grid;place-items:center}
.step .tools button:hover{background:var(--bg);color:var(--ink)}
.step .sb{padding:14px 16px 16px;display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
@media (max-width:1300px){.step .sb{grid-template-columns:1fr}}
.sec h4{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.rows{display:grid;gap:6px}
.r{display:grid;grid-template-columns:1fr 1fr 28px;gap:6px;align-items:center}
.r input,.r select{padding:7px 9px}
.r button{color:var(--sub);font-size:18px;line-height:1}
.rule{display:grid;grid-template-columns:auto 120px 1fr auto 1fr 28px;gap:6px;align-items:center;font-size:13px}
.rule select,.rule input{padding:7px 9px}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
.hint code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:11.5px}
.link{color:var(--rcs);font-weight:600;cursor:pointer;font-size:12.5px}
.warn{background:#fff8e6;border:1px solid #f1dfa6;color:#7a5a00;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.ok{background:#e9f8f1;border:1px solid #bfe9d3;color:#0a6d4a;border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.bad{background:#fdf0f0;border:1px solid #f1c9c9;color:var(--bad);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-top:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* simulator */
.sim{background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sim .sh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.sim .sh b{font-weight:800}
.phone{flex:1;overflow:auto;padding:16px;background:#eef0f3;display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.bub.in{background:#fff;border-bottom-left-radius:4px;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bub.out{background:var(--ink);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.bub.sys{align-self:center;background:transparent;color:var(--sub);font-size:11.5px;text-align:center}
.bub img{display:block;max-width:100%;border-radius:8px;margin-bottom:6px}
.bub .meta{font-size:10.5px;opacity:.6;margin-top:3px}
.qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:88%}
.qr button{background:#fff;border:1px solid var(--rcs);color:var(--rcs);border-radius:100px;padding:5px 12px;font-size:12.5px;font-weight:600}
.sim .in{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.sim .in input{border-radius:100px}
.sim .in button{border-radius:100px}
.tpl{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.tpl b{font-size:13.5px;font-weight:600;display:block}
.tpl small{color:var(--sub);font-size:12px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:420px}
.st{font-size:11px;font-weight:700;border-radius:100px;padding:2px 8px;background:var(--chip);color:var(--sub);text-transform:capitalize}
.st.approved{background:#e9f8f1;color:#0a6d4a}.st.rejected{background:#fdf0f0;color:var(--bad)}.st.pending,.st.submitted{background:#fff8e6;color:#7a5a00}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sgrid .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sgrid h5{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.sgrid ul{list-style:none;font-size:12.5px;color:var(--sub)}
.sgrid li{padding:2px 0}
.sgrid li.def{color:var(--ink);font-weight:600}
</style></head>
<body>
<div class="top"><b>Vonage flows</b><span class="sep"></span><span class="sub" id="portalLbl">Portal</span><span class="sp"></span><button onclick="showSenders()">Senders</button><button class="pri" onclick="newFlow()">New flow</button></div>
<div class="app">
  <aside class="side">
    <div class="tabs"><button class="on" id="tabFlows" onclick="setTab('flows')">Flows</button><button id="tabTpl" onclick="setTab('templates')">Templates</button></div>
    <div class="list" id="list"></div>
    <div class="foot" id="sideFoot"><button class="btn wide" onclick="newFlow()">+ New flow</button></div>
  </aside>
  <main class="main" id="main"></main>
  <aside class="sim" id="simWrap">
    <div class="sh"><div><b>Simulator</b><div class="hint" style="margin:0">Dry run, nothing is sent</div></div><button class="btn ghost sm" onclick="simStart()">Restart</button></div>
    <div class="phone" id="phone"><div class="bub sys">Save a flow, then press Restart to walk through it here. Replies you type are matched against the step rules exactly as on a real phone.</div></div>
    <div class="in"><input id="simIn" placeholder="Type a reply as the customer" onkeydown="if(event.key==='Enter')simReply(this.value)"><button class="btn" onclick="simReply(document.getElementById('simIn').value)">Send</button></div>
  </aside>
</div>
<script>
const qs = new URLSearchParams(location.search);
const PID = qs.get('portal') || qs.get('portalId') || '';
if (qs.get('embed')) document.body.classList.add('embed');
document.getElementById('portalLbl').textContent = PID ? 'HubSpot portal ' + PID : 'No portal id in the link';
// The card mints a short-lived session token (POST /2v/api/session, HubSpot-signed) and
// passes it as ?t=; every API call carries it, so this page is scoped to one portal.
const TOKEN = qs.get('t') || '';
const api = (p, o) => fetch(p, Object.assign({}, o || {}, { headers: Object.assign({ 'Content-Type': 'application/json' }, TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}, (o && o.headers) || {}) })).then(async (r) => { const j = await r.json().catch(() => ({})); if (r.status === 401) throw new Error('This builder link has expired. Close it and open Flows again from the HubSpot card.'); if (!r.ok) throw new Error(j.error || j.detail || r.statusText); return j; });
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 8);
const toast = (t) => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); };
const CH = { whatsapp: 'WhatsApp', rcs: 'RCS', sms: 'SMS' };
let S = { tab: 'flows', flows: [], cur: null, dirty: false, templates: [], waTpls: [], senders: null, defaults: {}, lists: null, tplEdit: null };

// ---------------------------------------------------------------- data
async function loadAll() {
  try { S.flows = (await api('/2v/api/flows?portalId=' + PID)).flows || []; } catch (e) { toast('Could not load flows: ' + e.message); }
  try { const r = await api('/2v/api/vonage/senders?portalId=' + PID); S.senders = r.senders; S.defaults = r.defaults; } catch (e) { S.senders = null; S.sendersErr = e.message; }
  loadTemplates().catch(() => {});
  renderList(); if (!S.cur) renderMain();
}
async function loadTemplates() {
  try { S.templates = (await api('/2v/api/templates?portalId=' + PID)).templates || []; } catch (e) {}
  try { const r = await api('/2v/api/wa/templates?portalId=' + PID); S.waTpls = (r.all || r.templates || []).filter((t) => String(t.status || '').toLowerCase() === 'approved'); } catch (e) { S.waTpls = []; }
  if (S.tab === 'templates') renderList();
  if (S.cur) renderMain(true);
}
function setTab(t) { S.tab = t; document.getElementById('tabFlows').classList.toggle('on', t === 'flows'); document.getElementById('tabTpl').classList.toggle('on', t === 'templates'); document.getElementById('sideFoot').innerHTML = t === 'flows' ? '<button class="btn wide" onclick="newFlow()">+ New flow</button>' : '<button class="btn wide" onclick="newTemplate()">+ New template</button>'; renderList(); }
const trigLabel = (f) => f.trigger.type === 'keyword' ? 'Keyword: ' + (f.trigger.keywords.join(', ') || '(none)') : f.trigger.type === 'any' ? 'Any inbound message' : 'Outbound only';
function renderList() {
  const el = document.getElementById('list');
  if (S.tab === 'flows') {
    el.innerHTML = S.flows.map((f) => `<button class="item ${S.cur && S.cur.id === f.id ? 'on' : ''}" onclick="openFlow('${f.id}')"><b>${esc(f.name)}</b><small><i class="dot ${f.enabled ? 'on' : ''}"></i><span class="tag ${f.channel}">${CH[f.channel]}</span>${esc(trigLabel(f))}</small></button>`).join('') || '<div class="hint" style="padding:12px">No flows yet. Create the first one.</div>';
  } else {
    const rows = S.templates.map((t) => `<button class="item ${S.tplEdit && S.tplEdit.id === t.id ? 'on' : ''}" onclick="editTemplate('${t.id}')"><b>${esc(t.name)}</b><small><span class="tag ${t.channel}">${CH[t.channel] || t.channel}</span>${esc(t.type || 'text')} <span class="st ${esc(t.status || '')}">${esc(t.status || 'ready')}</span></small></button>`).join('');
    const wa = S.waTpls.map((t) => `<div class="item"><b>${esc(t.name)}</b><small><span class="tag whatsapp">WABA</span>${esc(t.language || '')} <span class="st approved">approved</span></small></div>`).join('');
    el.innerHTML = (rows || '<div class="hint" style="padding:12px">No templates built here yet.</div>') + (wa ? '<div class="hint" style="padding:12px 12px 4px;font-weight:700">Approved on your WhatsApp Business Account</div>' + wa : '');
  }
}

// ---------------------------------------------------------------- flow editor
function newFlow() { S.cur = { id: '', name: 'New flow', channel: 'whatsapp', from: '', enabled: true, trigger: { type: 'keyword', keywords: [], match: 'exact' }, steps: [newStep(1)] }; S.tplEdit = null; setTab('flows'); renderList(); renderMain(); }
function newStep(n) { return { id: 's' + uid(), name: 'Step ' + n, msg: { kind: 'text', text: '', mediaUrl: '', buttons: [], templateId: '', waName: '', waLang: 'en', waParams: [] }, then: { mode: 'next', goto: '', rules: [], noMatch: { mode: 'repeat', goto: '', text: '' } }, actions: [] }; }
function openFlow(id) { const f = S.flows.find((x) => x.id === id); if (!f) return; S.cur = JSON.parse(JSON.stringify(f)); S.tplEdit = null; renderList(); renderMain(); }
const senderOpts = (ch, val) => { const list = (S.senders && S.senders[ch]) || []; const def = S.defaults[ch] || ''; return `<option value="">Default sender${def ? ' (' + esc(def) + ')' : ' - none set'}</option>` + list.map((s) => `<option value="${esc(s.id)}" ${s.id === val ? 'selected' : ''}>${esc(s.label)}</option>`).join(''); };
const stepOpts = (f, val, allowNone) => (allowNone ? `<option value="">next step</option>` : '') + f.steps.map((s, i) => `<option value="${s.id}" ${s.id === val ? 'selected' : ''}>${i + 1}. ${esc(s.name)}</option>`).join('');
function renderMain(keepScroll) {
  const m = document.getElementById('main'); const y = m.scrollTop;
  if (S.tplEdit) { m.innerHTML = templateForm(S.tplEdit); return; }
  const f = S.cur;
  if (!f) { m.innerHTML = `<div class="empty"><h2>Conversational flows for WhatsApp, RCS and SMS</h2><p>A flow starts on a keyword, on any inbound message, or when you start it for a contact, a list or from a HubSpot workflow. Each step sends a message or a template, then branches on the reply: if this, then that.</p><br><button class="btn" onclick="newFlow()">Create your first flow</button></div>`; return; }
  const chWarn = f.channel === 'whatsapp' && f.trigger.type === 'outbound' && f.steps[0] && f.steps[0].msg.kind === 'text' ? '<div class="warn">Outbound WhatsApp must open with an approved template (24-hour rule). Make step 1 a WhatsApp template.</div>' : '';
  m.innerHTML = `
  <div class="head"><input class="name" value="${esc(f.name)}" oninput="S.cur.name=this.value;mark()" style="flex:1">
    <label class="sw ${f.enabled ? 'on' : ''}" onclick="S.cur.enabled=!S.cur.enabled;mark();renderMain(true)"><i></i>${f.enabled ? 'Enabled' : 'Disabled'}</label>
    <button class="btn" onclick="saveFlow()">Save flow</button>${f.id ? `<button class="btn danger sm" onclick="deleteFlow()">Delete</button>` : ''}</div>
  <div class="card"><div class="row3">
    <div><label class="l">Channel</label><select onchange="S.cur.channel=this.value;S.cur.from='';mark();renderMain(true)"><option value="whatsapp" ${f.channel === 'whatsapp' ? 'selected' : ''}>WhatsApp</option><option value="rcs" ${f.channel === 'rcs' ? 'selected' : ''}>RCS</option><option value="sms" ${f.channel === 'sms' ? 'selected' : ''}>SMS</option></select></div>
    <div><label class="l">Send from</label><select onchange="S.cur.from=this.value;mark()">${senderOpts(f.channel, f.from)}</select><div class="hint">${S.senders ? (S.senders[f.channel] || []).length + ' ' + CH[f.channel] + ' sender(s) found on your Vonage application' : 'Senders not loaded' + (S.sendersErr ? ': ' + esc(S.sendersErr) : '')} <span class="link" onclick="showSenders()">manage</span></div></div>
    <div><label class="l">Starts when</label><select onchange="S.cur.trigger.type=this.value;mark();renderMain(true)"><option value="keyword" ${f.trigger.type === 'keyword' ? 'selected' : ''}>A keyword is received</option><option value="any" ${f.trigger.type === 'any' ? 'selected' : ''}>Any inbound message (no keyword)</option><option value="outbound" ${f.trigger.type === 'outbound' ? 'selected' : ''}>I start it (contact, list, API, workflow)</option></select></div>
  </div>
  ${f.trigger.type === 'keyword' ? `<label class="l">Trigger words <span style="font-weight:400">(Enter to add)</span></label><div class="kw">${f.trigger.keywords.map((k, i) => `<span>${esc(k)}<b onclick="S.cur.trigger.keywords.splice(${i},1);mark();renderMain(true)">&times;</b></span>`).join('')}<input placeholder="e.g. HELLO, OFFER, START" onkeydown="if(event.key==='Enter'){event.preventDefault();const v=this.value.trim();if(v){S.cur.trigger.keywords.push(v);mark();renderMain(true)}}"></div>
  <div style="margin-top:8px" class="seg"><button class="${f.trigger.match === 'exact' ? 'on' : ''}" onclick="S.cur.trigger.match='exact';mark();renderMain(true)">Exact word</button><button class="${f.trigger.match === 'contains' ? 'on' : ''}" onclick="S.cur.trigger.match='contains';mark();renderMain(true)">Message contains it</button></div>` : ''}
  ${f.trigger.type === 'any' ? '<div class="hint">Catches every inbound message on this channel that is not a keyword of another flow and not part of a running conversation. Keep one catch-all per channel.</div>' : ''}
  ${f.trigger.type === 'outbound' ? '<div class="hint">Start it from the Flows list on a contact record, from a HubSpot list below, from the workflow action "Start Vonage flow", or with <code>POST /2v/api/flows/' + esc(f.id || '{id}') + '/start {portalId, to}</code>.</div>' : ''}
  ${chWarn}
  <div class="hint" style="margin-top:10px">Variables you can use in any text: <code>{{firstname}}</code> <code>{{lastname}}</code> <code>{{name}}</code> <code>{{phone}}</code> <code>{{email}}</code> <code>{{company}}</code> <code>{{reply}}</code> (the last reply).</div>
  </div>
  <div id="steps">${f.steps.map((s, i) => stepHtml(f, s, i)).join('')}</div>
  <div class="actions"><button class="btn ghost" onclick="S.cur.steps.push(newStep(S.cur.steps.length+1));mark();renderMain(true)">+ Add step</button></div>
  <div class="card" style="margin-top:22px"><h3>Run it for real</h3>

  const sel = (k) => `<select onchange="S.defaults['${k}']=this.value"><option value="">- none -</option>${(s[k] || []).map((x) => `<option value="${esc(x.id)}" ${x.id === S.defaults[k] ? 'selected' : ''}>${esc(x.label)}</option>`).join('')}</select>`;
  m.innerHTML = `<div class="head"><h2 style="flex:1;font-size:20px;font-weight:800">Senders on your Vonage application</h2><button class="btn ghost" onclick="showSenders(true)">Refresh from Vonage</button></div>
  <div class="card"><div class="sgrid">${box('whatsapp', 'WhatsApp')}${box('rcs', 'RCS agents')}${box('sms', 'SMS numbers')}${box('voice', 'Voice numbers')}</div>
  <div class="hint" style="margin-top:10px">Read from your Vonage account: numbers and WhatsApp numbers and RCS agents that are linked to the application you connected. Link more agents or numbers to that application in the Vonage dashboard, then refresh. ${s.error ? '<br>Note: ' + esc(s.error) : ''}${s.at ? '<br>Last read ' + new Date(s.at).toLocaleString() : ''}</div></div>
  <div class="card"><h3>Default sender per channel</h3><div class="hint" style="margin:0 0 8px">Used by the contact cards, campaigns and workflow actions. Each flow can override it.</div>
  <div class="sgrid"><div><label class="l">WhatsApp</label>${sel('whatsapp')}</div><div><label class="l">RCS</label>${sel('rcs')}</div><div><label class="l">SMS</label>${sel('sms')}</div><div><label class="l">Voice</label>${sel('voice')}</div></div>
  <div style="margin-top:14px"><button class="btn" onclick="saveDefaults()">Save defaults</button></div></div>`;
}
async function saveDefaults() { try { await api('/2v/api/vonage/defaults', { method: 'POST', body: JSON.stringify(Object.assign({ portalId: PID }, S.defaults)) }); toast('Defaults saved'); showSenders(); } catch (e) { toast(e.message); } }
window.addEventListener('beforeunload', (e) => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
loadAll();
</script></body></html>
